# IndiraGPT — nginx site for gptindira.indiraivf.in
#
# Install:
#   sudo cp deploy/nginx/gptindira.conf /etc/nginx/sites-available/gptindira.conf
#   sudo ln -sf /etc/nginx/sites-available/gptindira.conf /etc/nginx/sites-enabled/
#   # Edit root= path and proxy_pass port if you changed PORT in .env
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gptindira.indiraivf.in

server {
    listen 80;
    server_name gptindira.indiraivf.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gptindira.indiraivf.in;

    # certbot will populate these paths
    ssl_certificate     /etc/letsencrypt/live/gptindira.indiraivf.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gptindira.indiraivf.in/privkey.pem;

    # UPDATE: path to your clone on the server
    root /home/aiadmin/gptindira/GPT-Indira-New-main/frontend/dist;
    index index.html;

    client_max_body_size 500M;

    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /data/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

